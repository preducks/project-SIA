<!DOCTYPE html><html lang='pt-br'><head>
<meta charset='UTF-8'><title>Relatórios - SIA</title>
<meta name='viewport' content='width=device-width,initial-scale=1.0'>
<link href='https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&family=Instrument+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap' rel='stylesheet'>
<link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css' rel='stylesheet'>
<link rel='stylesheet' href='/style.css'>
<link rel='stylesheet' href='/rel.css'>
<script src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js'></script>
</head><body>
<div class='sidebar-rel'>
  <h2><i class='fa-solid fa-clock-rotate-left' style='margin-right:7px'></i>Histórico de Regas</h2>
  <div id='historico-rel'><div class='empty-hist'><i class='fa-solid fa-seedling'></i>Carregando...</div></div>
</div>
<div class='main-rel'>
  <div class='rel-header'>
    <h2>Relatórios</h2>
    <div class='status-badge'><span class='status-dot'></span>Atualização automática</div>
  </div>
  <div class='stats-row'>
    <div class='stat-card sc-green'><div class='sc-icon'><i class='fa-solid fa-rotate'></i></div><div class='sc-val' id='stat-total'>--</div><div class='sc-lbl'>Total de Regas</div></div>
    <div class='stat-card sc-blue'><div class='sc-icon'><i class='fa-solid fa-calendar-day'></i></div><div class='sc-val' id='stat-hoje'>--</div><div class='sc-lbl'>Regas Hoje</div></div>
    <div class='stat-card sc-orange'><div class='sc-icon'><i class='fa-solid fa-chart-line'></i></div><div class='sc-val' id='stat-media'>--</div><div class='sc-lbl'>Média Diária (7d)</div></div>
    <div class='stat-card sc-purple'><div class='sc-icon'><i class='fa-solid fa-bucket'></i></div><div class='sc-val' id='stat-nivel'>--</div><div class='sc-lbl'>Nível Reserv.</div></div>
  </div>
  <div class='chart-card'>
    <h3><i class='fa-solid fa-chart-column'></i>Regas por Dia — Últimos 7 dias</h3>
    <div class='chart-wrap'><canvas id='chart-regas'></canvas></div>
  </div>
</div>
<button class='sidebar-toggle'><i class='fa-solid fa-bars'></i></button>
<div class='sidebar-overlay'></div>
<button class='voltar' onclick="window.location.href='/dashboard'"><i class='fa-solid fa-arrow-left'></i> Voltar</button>
<script src='/rel.js'></script>
</body></html>
