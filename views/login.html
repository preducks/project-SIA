<!DOCTYPE html><html lang='pt-br'><head>
<meta charset='UTF-8'><title>Login - SIA</title>
<meta name='viewport' content='width=device-width,initial-scale=1.0'>
<link href='https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&family=Instrument+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap' rel='stylesheet'>
<link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css' rel='stylesheet'>
<link rel='stylesheet' href='/style.css'>
<link rel='stylesheet' href='/login.css'>

<!-- Google Identity Services (login com Google) -->
<script src='https://accounts.google.com/gsi/client' async defer></script>
</head><body>
<div class='topbar'>
  <div class='topbar-brand'><span class='topbar-dot'></span><span>Sistema de Irrigação Automatizado</span></div>
  <nav class='topbar-nav'>
    <button class='nav-btn' onclick="window.location.href='/'"><i class='fa-solid fa-house'></i> Home</button>
    <button class='nav-btn active' onclick="window.location.href='/login'"><i class='fa-solid fa-right-to-bracket'></i> Login</button>
  </nav>
</div>
<div class='hero'>
  <div class='hero-bg'></div><div class='hero-overlay'></div>
  <div class='loginCard'>
    <div class='logo-mark'><i class='fa-solid fa-leaf'></i></div>
    <h2>Bem-vindo</h2>
    <p class='tag'>Acesse o painel de controle</p>
    <div class='field'>
      <label><i class='fa-solid fa-user'></i> Usuário</label>
      <input id='nome' placeholder='Digite seu nome'>
    </div>
    <div class='field'>
      <label><i class='fa-solid fa-lock'></i> Senha</label>
      <input id='senha' type='password' placeholder='••••••••'>
    </div>
    <button onclick='login()'><i class='fa-solid fa-right-to-bracket'></i> Entrar</button>
    <div id='erro' class='erro'></div>

    <p class='cadastro-link'>Ainda não tem conta? <a href='/cadastro'>Cadastre-se</a></p>

    <div class='divider'><span>ou</span></div>

    <!-- Botão de login com Google.
         Troque o data-client_id abaixo pelo Client ID do seu projeto
         no Google Cloud Console (APIs & Services > Credentials). -->
    <div id='g_id_onload'
         data-client_id='COLOQUE_AQUI_SEU_GOOGLE_CLIENT_ID.apps.googleusercontent.com'
         data-callback='handleGoogleLogin'
         data-auto_prompt='false'>
    </div>
    <div class='google-btn-wrap'>
      <div class='g_id_signin'
           data-type='standard'
           data-shape='rectangular'
           data-theme='outline'
           data-text='continue_with'
           data-size='large'
           data-logo_alignment='left'
           data-width='288'>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var n=new Date();
  var p='ano='+n.getFullYear()+'&mes='+(n.getMonth()+1)+'&dia='+n.getDate()
       +'&hora='+n.getHours()+'&min='+n.getMinutes()+'&seg='+n.getSeconds();
  fetch('/set_hora?'+p).catch(function(){});
})();

async function login(){
  var n=document.getElementById('nome').value;
  var s=document.getElementById('senha').value;
  document.getElementById('erro').innerText='';

  try{
    var r = await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ nome:n, senha:s })
    });
    var j = await r.json();

    if(j.ok){
      window.location.href='/dashboard';
    }else{
      document.getElementById('erro').innerText = j.erro || 'Nome ou senha incorretos!';
    }
  }catch(e){
    document.getElementById('erro').innerText = 'Erro de conexão com o servidor.';
  }
}

// Decodifica o token (JWT) que o Google devolve, sem precisar de backend extra
function parseJwt(token){
  var base64Url = token.split('.')[1];
  var base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/');
  var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c){
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
  return JSON.parse(jsonPayload);
}

async function handleGoogleLogin(response){
  document.getElementById('erro').innerText='';
  try{
    var dados = parseJwt(response.credential);
    var r = await fetch('/api/google', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ nome: dados.name, email: dados.email })
    });
    var j = await r.json();

    if(j.ok){
      window.location.href='/dashboard';
    }else{
      document.getElementById('erro').innerText = j.erro || 'Erro ao entrar com Google.';
    }
  }catch(e){
    document.getElementById('erro').innerText = 'Erro ao processar login com Google.';
  }
}

document.addEventListener('keydown',function(e){if(e.key==='Enter')login();});
</script>
</body></html>
