<!DOCTYPE html><html lang='pt-br'><head>
<meta charset='UTF-8'><title>Cadastro - SIA</title>
<meta name='viewport' content='width=device-width,initial-scale=1.0'>
<link href='https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&family=Instrument+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap' rel='stylesheet'>
<link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css' rel='stylesheet'>
<link rel='stylesheet' href='/style.css'>
<link rel='stylesheet' href='/login.css'>

<!-- Google Identity Services (cadastro com Google) -->
<script src='https://accounts.google.com/gsi/client' async defer></script>
</head><body>
<div class='topbar'>
  <div class='topbar-brand'><span class='topbar-dot'></span><span>Sistema de Irrigação Automatizado</span></div>
  <nav class='topbar-nav'>
    <button class='nav-btn' onclick="window.location.href='/'"><i class='fa-solid fa-house'></i> Home</button>
    <button class='nav-btn active' onclick="window.location.href='/login'"><i class='fa-solid fa-right-to-bracket'></i> Login</button>
  </nav>
</div>
<div class='hero'>
  <div class='hero-bg'></div><div class='hero-overlay'></div>
  <div class='loginCard'>
    <div class='logo-mark'><i class='fa-solid fa-leaf'></i></div>
    <h2>Criar conta</h2>
    <p class='tag'>Cadastre-se para acessar o painel</p>

    <div class='field'>
      <label><i class='fa-solid fa-user'></i> Usuário</label>
      <input id='nome' placeholder='Escolha um nome de usuário'>
    </div>
    <div class='field'>
      <label><i class='fa-solid fa-lock'></i> Senha</label>
      <input id='senha' type='password' placeholder='••••••••'>
    </div>
    <div class='field'>
      <label><i class='fa-solid fa-lock'></i> Confirmar senha</label>
      <input id='confirmar' type='password' placeholder='••••••••'>
    </div>

    <button onclick='registrar()'><i class='fa-solid fa-user-plus'></i> Cadastrar</button>
    <div id='erro' class='erro'></div>

    <p class='cadastro-link'>Já tem conta? <a href='/login'>Entrar</a></p>

    <div class='divider'><span>ou</span></div>

    <!-- Troque o data-client_id abaixo pelo Client ID do seu projeto
         no Google Cloud Console (APIs & Services > Credentials). -->
    <div id='g_id_onload'
         data-client_id='COLOQUE_AQUI_SEU_GOOGLE_CLIENT_ID.apps.googleusercontent.com'
         data-callback='handleGoogleLogin'
         data-auto_prompt='false'>
    </div>
    <div class='google-btn-wrap'>
      <div class='g_id_signin'
           data-type='standard'
           data-shape='rectangular'
           data-theme='outline'
           data-text='signup_with'
           data-size='large'
           data-logo_alignment='left'
           data-width='288'>
      </div>
    </div>
  </div>
</div>

<script>
async function registrar(){
  var n=document.getElementById('nome').value.trim();
  var s=document.getElementById('senha').value;
  var c=document.getElementById('confirmar').value;
  var erro=document.getElementById('erro');
  erro.innerText='';

  if(!n || !s){
    erro.innerText='Preencha usuário e senha.';
    return;
  }
  if(s !== c){
    erro.innerText='As senhas não conferem.';
    return;
  }

  try{
    var r = await fetch('/api/registrar', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ nome:n, senha:s })
    });
    var j = await r.json();

    if(j.ok){
      window.location.href='/login';
    }else{
      erro.innerText = j.erro || 'Não foi possível cadastrar.';
    }
  }catch(e){
    erro.innerText = 'Erro de conexão com o servidor.';
  }
}

function parseJwt(token){
  var base64Url = token.split('.')[1];
  var base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/');
  var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c){
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
  return JSON.parse(jsonPayload);
}

async function handleGoogleLogin(response){
  document.getElementById('erro').innerText='';
  try{
    var dados = parseJwt(response.credential);
    var r = await fetch('/api/google', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ nome: dados.name, email: dados.email })
    });
    var j = await r.json();

    if(j.ok){
      window.location.href='/dashboard';
    }else{
      document.getElementById('erro').innerText = j.erro || 'Erro ao entrar com Google.';
    }
  }catch(e){
    document.getElementById('erro').innerText = 'Erro ao processar login com Google.';
  }
}

document.addEventListener('keydown',function(e){if(e.key==='Enter')registrar();});
</script>
</body></html>
