<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IA SIA</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&family=Instrument+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/ia.css">
</head>

<body>

<div class="sidebar-hist">
    <h2>Histórico</h2>
    <div id="historico"></div>
</div>

<div class="main-ia">

    <div class="chat">

        <div class="chat-header">
            <div class="ia-icon">
                <i class="fa-solid fa-asterisk"></i>
            </div>

            <div>
                <h2>Assistente IA — SIA</h2>
                <p>Pergunte sobre irrigação, sensores e recomendações.</p>
            </div>
        </div>

        <div class="chat-body">

            <div class="user-msg" id="pergunta" style="display:none"></div>

            <div class="assistant-msg" id="res">
                Faça uma pergunta para começar.
            </div>

        </div>

        <div class="chat-input">

            <input
                id="q"
                placeholder="Digite sua pergunta..."
                onkeydown="if(event.key==='Enter') perguntar();"
            >

            <button
                class="send-btn"
                onclick="document.getElementById('pergunta').style.display='block';
                document.getElementById('pergunta').innerText=document.getElementById('q').value;
                perguntar();">

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </div>

    </div>

</div>

<button class="sidebar-toggle">
<i class="fa-solid fa-bars"></i>
</button>

<div class="sidebar-overlay"></div>

<button class="voltar"
onclick="window.location.href='/dashboard'">
<i class="fa-solid fa-arrow-left"></i>
Voltar
</button>

<script src="/ia.js"></script>

</body>
</html>
